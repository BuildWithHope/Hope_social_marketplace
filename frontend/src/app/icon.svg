<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="8" />

  <!-- Outer Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#icon-grad)" stroke-width="6" opacity="0.3" />

  <!-- Social Growth / Marketplace Spark & Bolt Emblem -->
  <g filter="url(#glow)">
    <!-- Central Lightning Sparkle -->
    <path d="M280 64 L160 272 H256 L232 448 L352 240 H256 Z" fill="url(#icon-grad)" />
    <!-- Social Connection Node Orbs -->
    <circle cx="140" cy="140" r="28" fill="#10b981" />
    <circle cx="372" cy="140" r="24" fill="#06b6d4" />
    <circle cx="372" cy="372" r="28" fill="#34d399" />
    <!-- Connecting Tech Lines -->
    <path d="M160 156 L200 200" stroke="#10b981" stroke-width="8" stroke-linecap="round" opacity="0.7" />
    <path d="M350 156 L310 200" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" opacity="0.7" />
    <path d="M350 356 L310 310" stroke="#34d399" stroke-width="8" stroke-linecap="round" opacity="0.7" />
  </g>
</svg>
